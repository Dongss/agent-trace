# Runs the tests on every push to main and every pull request targeting it.
#
# release.yml runs the same matrix before publishing. The duplication is
# deliberate: that gate is about what ships, this one is about what is on main
# right now.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    strategy:
      # Report every platform, not just the first to break: which ones fail is
      # the useful part when a failure is platform-specific.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      # The suite must pass with no agent CLI and no account present, which is
      # exactly what a fresh runner is: TestRealTranscripts and the scan
      # benchmark skip themselves when there are no transcripts to read.
      - name: Test
        run: go test ./...

      # The race detector needs a C toolchain, which is dependable on Linux and
      # fiddly elsewhere; one platform running it is enough to catch a data race.
      - name: Test with the race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

  # Rewrites the shields.io endpoint document the README's coverage badge points
  # at.
  #
  # Four deliberate choices. It runs only on pushes to main, because a pull
  # request must not move a badge that describes main — and on a fork the
  # secret is not available anyway. It talks to the gist with `gh api` rather
  # than a third-party badge action, to keep somebody else's code out of a job
  # that holds a token. It is never fatal: a missing secret, a rate limit or a
  # gist hiccup exits 0, and continue-on-error covers the rest, because a stale
  # badge must not turn main red. And the token is a PAT with `gist` scope
  # only, because the built-in GITHUB_TOKEN cannot write to a gist.
  #
  # -coverpkg=./... measures the whole module rather than each package against
  # its own tests: internal/event carries no test files of its own but is
  # exercised by every package above it, and per-package counting scores that
  # as zero. The number is lower here than on a developer's machine —
  # TestRealTranscripts and the scan benchmark skip themselves when there are
  # no transcripts to read — and the runner's figure is the one worth
  # publishing, because it is the one anybody can reproduce.
  coverage:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Measure and publish
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: c7ef84f8a44585c1b108650219b85664
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "GIST_TOKEN is not set; skipping the coverage badge."
            exit 0
          fi
          go test -coverpkg=./... -coverprofile=coverage.out ./... >/dev/null
          pct=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "total coverage: ${pct}%"
          whole=${pct%%.*}
          if   [ "$whole" -ge 85 ]; then color=brightgreen
          elif [ "$whole" -ge 70 ]; then color=green
          elif [ "$whole" -ge 55 ]; then color=yellowgreen
          elif [ "$whole" -ge 40 ]; then color=yellow
          else                           color=orange
          fi
          # The gist holds a shields.io endpoint document, so the badge JSON is
          # itself a string inside the PATCH body.
          badge=$(jq -nc --arg m "${pct}%" --arg c "$color" \
            '{schemaVersion: 1, label: "coverage", message: $m, color: $c}')
          jq -nc --arg b "$badge" \
            '{files: {"agent-trace-coverage.json": {content: $b}}}' \
            | gh api "gists/${GIST_ID}" --method PATCH --input - >/dev/null
          echo "badge updated: ${pct}% (${color})"
